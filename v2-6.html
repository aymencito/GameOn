<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090d0f"><title>GameOn 2.6</title><style>html,body{margin:0;width:100%;height:100%;background:#090d0f;overflow:hidden}iframe{border:0;width:100%;height:100%;display:block;background:#090d0f}</style></head><body><iframe id="app" title="GameOn"></iframe><script>const frame=document.getElementById('app');const outerQS=location.search;frame.src='/v2-4.html'+(outerQS?outerQS+'&base=26':'?base=26');frame.addEventListener('load',()=>{try{const d=frame.contentDocument;const s=d.createElement('script');s.src='/gameon-2.6.js?v=2';s.dataset.gameon26='1';s.onload=()=>{const p=d.createElement('script');p.textContent=`gameLink=function(id){return window.top.location.origin+'/v2-6.html?game='+encodeURIComponent(id)};sendLink=async function(){let email=$('email').value.trim();if(!email){$('authMsg').innerHTML='<div class="error">Enter your email address.</div>';return}let suffix=currentGameId?'?game='+encodeURIComponent(currentGameId):'';let q=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:window.top.location.origin+'/v2-6.html'+suffix}});$('authMsg').innerHTML='<div class="'+(q.error?'error':'ok')+'">'+esc(q.error?.message||'Check your email for your GameOn sign-in link.')+'</div>'};`;d.body.appendChild(p);const gid=new URLSearchParams(window.top.location.search).get('game');if(gid)d.defaultView.openGame(gid);};d.body.appendChild(s);const badge=d.querySelector('#home .muted');if(badge)badge.textContent='GLASGOW · 2.6';}catch(e){console.error('GameOn 2.6 load failed',e)}});</script></body></html>
