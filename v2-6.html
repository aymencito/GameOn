<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090d0f"><title>GameOn 2.6</title><style>html,body{margin:0;width:100%;height:100%;background:#090d0f;overflow:hidden}iframe{border:0;width:100%;height:100%;display:block;background:#090d0f;visibility:hidden}</style></head><body><iframe id="app" title="GameOn"></iframe><script>const frame=document.getElementById('app');const params=new URLSearchParams(location.search);const onein=params.get('onein')==='1';const outerQS=location.search;frame.src='/v2-4.html'+(outerQS?outerQS+'&base=26':'?base=26');frame.addEventListener('load',()=>{try{const d=frame.contentDocument;const s=d.createElement('script');s.src='/gameon-2.6.js?v=2';s.dataset.gameon26='1';s.onload=()=>{const p=d.createElement('script');p.textContent=`const __onein=${onein?'true':'false'};if(__onein){document.title='ONEIN — Find your spot';const st=document.createElement('style');st.textContent=':root{--green:#73ff8c;--red:#ff5964;--bg:#070b0c;--card:#101719;--line:#223036;--muted:#8e9da4}body{background:radial-gradient(circle at 82% -4%,rgba(115,255,140,.14),transparent 28%),linear-gradient(180deg,#070a0b,#090e10)}.brand{font-style:normal;font-size:31px;letter-spacing:-1.8px}.brand .onein-in{color:var(--green)}.hero{font-size:41px;line-height:1.01;margin-top:32px}.hero span{color:var(--green)}.choice{min-height:150px;border-radius:24px}.choice:after{content:"1";font-weight:950;font-style:italic;font-size:150px;right:3px;top:-35px;opacity:.045}.card,.fieldGroup{border-radius:22px}.btn{border-radius:16px}';document.head.appendChild(st);const h=$('home');if(h){const b=h.querySelector('.brand');if(b)b.innerHTML='ONE<span class="onein-in">IN</span>';const badge=h.querySelector('.muted');if(badge)badge.textContent='GLASGOW · FOOTBALL BETA';const hero=h.querySelector('.hero');if(hero)hero.innerHTML='Someone dropped out?<br><span>Keep the game on.</span>';const sub=h.querySelector('.sub');if(sub)sub.textContent='Your team stays yours. ONEIN finds the missing players before kickoff.';const c=h.querySelectorAll('.choice');if(c[0]){c[0].querySelector('h2').textContent='I NEED PLAYERS';c[0].querySelector('.muted').textContent='Fill only the spots your group is missing.'}if(c[1]){c[1].querySelector('h2').textContent='FIND A SPOT';c[1].querySelector('.muted').textContent='See nearby games with places open.'}}const fh=$('find')?.querySelector('h1');if(fh)fh.textContent='Find a spot';const gd=$('gameDetail')?.querySelector('h1');if(gd)gd.textContent='Spot details';const sh=$('short')?.querySelector('h1');if(sh)sh.textContent='Need players';const pb=$('short')?.querySelector('.btn.red');if(pb)pb.textContent='FIND MY PLAYERS';const mb=$('mygames')?.querySelector('.btn.red');if(mb)mb.textContent='＋ NEED PLAYERS';const fb=$('myplay')?.querySelector('.btn.green');if(fb)fb.textContent='＋ FIND A SPOT';}gameLink=function(id){return window.top.location.origin+'/v2-6.html?'+(__onein?'onein=1&':'')+'game='+encodeURIComponent(id)};sendLink=async function(){let email=$('email').value.trim();if(!email){$('authMsg').innerHTML='<div class="error">Enter your email address.</div>';return}let suffix=(__onein?'?onein=1':'')+(currentGameId?(__onein?'&':'?')+'game='+encodeURIComponent(currentGameId):'');let q=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:window.top.location.origin+'/v2-6.html'+suffix}});$('authMsg').innerHTML='<div class="'+(q.error?'error':'ok')+'">'+esc(q.error?.message||('Check your email for your '+(__onein?'ONEIN':'GameOn')+' sign-in link.'))+'</div>'};`;d.body.appendChild(p);const badge=d.querySelector('#home .muted');if(badge&&!onein)badge.textContent='GLASGOW · 2.6';const gid=params.get('game');if(gid)d.defaultView.openGame(gid);frame.title=onein?'ONEIN':'GameOn';frame.style.visibility='visible';};s.onerror=()=>{console.error('GameOn 2.6 patch failed to load');frame.style.visibility='visible'};d.body.appendChild(s);}catch(e){console.error('GameOn 2.6 load failed',e);frame.style.visibility='visible'}});</script></body></html>
