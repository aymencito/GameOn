name: Inject Game Management

on:
  push:
    paths:
      - '.github/workflows/inject-game-management.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject script tag
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          tag = '<script src="game-management.js"></script>'
          if tag not in s:
              s = s.replace('</body>', tag + '</body>')
              p.write_text(s)
          PY
      - name: Commit change
        run: |
          git config user.name "gameon-bot"
          git config user.email "gameon-bot@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Enable organiser game management"
            git push
          fi
