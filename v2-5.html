<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090d0f"><title>GameOn 2.5</title><style>html,body{margin:0;width:100%;height:100%;background:#090d0f;overflow:hidden}iframe{border:0;width:100%;height:100%;display:block;background:#090d0f}</style></head><body><iframe id="app" title="GameOn"></iframe><script>
const frame=document.getElementById('app');
frame.src='/v2-4.html'+location.search;
frame.addEventListener('load',()=>{
  try{
    const d=frame.contentDocument;
    if(!d.querySelector('script[data-gameon-detail-fix]')){
      const s=d.createElement('script');
      s.src='/gameon-2.4-detail-fix.js?v=2';
      s.dataset.gameonDetailFix='1';
      d.body.appendChild(s);
    }
    if(!d.querySelector('script[data-gameon-myplay-fix]')){
      const s2=d.createElement('script');
      s2.src='/gameon-2.5-myplay-fix.js?v=1';
      s2.dataset.gameonMyplayFix='1';
      d.body.appendChild(s2);
    }
    if(!d.querySelector('script[data-gameon-expiry-requests-fix]')){
      const s3=d.createElement('script');
      s3.src='/gameon-2.5-expiry-requests-fix.js?v=2';
      s3.dataset.gameonExpiryRequestsFix='1';
      d.body.appendChild(s3);
    }
    if(!d.querySelector('script[data-gameon-organiser-requests-v2]')){
      const s4=d.createElement('script');
      s4.src='/gameon-2.5-organiser-requests-fix-v2.js?v=1';
      s4.dataset.gameonOrganiserRequestsV2='1';
      d.body.appendChild(s4);
    }
  }catch(e){console.error('GameOn patch load failed',e)}
});
</script></body></html>
