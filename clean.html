<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0f12"><title>GameOn Clean</title><style>html,body{margin:0;height:100%;background:#0b0f12}iframe{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="app" src="./?clean=2"></iframe><script>
const f=document.getElementById('app');
f.addEventListener('load',()=>{const w=f.contentWindow,d=f.contentDocument;if(!d||!w)return;
const home=d.getElementById('home');if(home){const buttons=[...home.querySelectorAll('button')];buttons.forEach(b=>{if(b.textContent.includes('MY REQUESTS')||b.textContent.includes('GAME INVITES'))b.style.display='none'});const organise=buttons.find(b=>b.textContent.includes('ORGANISE'));const pool=buttons.find(b=>b.textContent.includes('PLAYER POOL'));const play=buttons.find(b=>b.textContent.includes('I WANT TO PLAY'));const act=d.createElement('button');act.className='btn ghost';act.innerHTML='📋 MY ACTIVITY';act.onclick=()=>openActivity();if(organise)home.insertBefore(act,organise);if(play)play.textContent='⚽ FIND A GAME';if(organise)organise.childNodes[0].textContent='👥 ORGANISE ';if(pool)pool.textContent='🟢 PLAYER POOL';}
const app=d.querySelector('.app');if(app&&!d.getElementById('cleanActivity')){const s=d.createElement('section');s.id='cleanActivity';s.className='screen';s.innerHTML='<button class="back">‹</button><h2>My Activity</h2><p class="sub">Your active requests and invitations.</p><div id="cleanActive"></div><button id="cleanPastBtn" class="btn ghost small">PAST ACTIVITY</button><div id="cleanPast" class="hidden"></div><div id="cleanErr" class="error"></div>';s.querySelector('.back').onclick=()=>w.show('home');s.querySelector('#cleanPastBtn').onclick=()=>s.querySelector('#cleanPast').classList.toggle('hidden');app.appendChild(s)}
const footer=d.querySelector('.footer');if(footer){footer.innerHTML='<div>⚽<br>Play</div><div>📋<br>Activity</div><div>👥<br>Organise</div><div>⌂<br>Home</div>';const a=[...footer.children];a[0].onclick=()=>w.openGames();a[1].onclick=()=>openActivity();a[2].onclick=()=>w.organiserEntry();a[3].onclick=()=>w.show('home')}
async function openActivity(){w.show('cleanActivity');const active=d.getElementById('cleanActive'),past=d.getElementById('cleanPast'),er=d.getElementById('cleanErr');active.innerHTML='<p class="muted">Loading…</p>';past.innerHTML='';er.style.display='none';let aa=[],pp=[];try{for(const token of w.getTokens()){const q=await w.sb.rpc('get_request_status',{p_tracking_token:token});if(!q.error&&q.data&&q.data[0]){const r=q.data[0];((r.request_status==='pending'||r.request_status==='accepted')?aa:pp).push({type:'request',...r})}}const pt=w.localStorage.getItem('gameon_pool_token');if(pt){const q=await w.sb.rpc('get_pool_invites',{p_tracking_token:pt});if(!q.error&&q.data)q.data.forEach(r=>((r.invite_status==='invited'&&r.game_status==='open')?aa:pp).push({type:'invite',...r}))}const render=x=>{if(x.type==='invite')return `<div class="card"><span class="tag ${x.invite_status==='invited'?'pending':'declined'}">${w.esc((x.game_status==='cancelled'?'GAME CANCELLED':x.invite_status).toUpperCase())}</span><b>${w.esc(x.venue)}</b><div class="muted">${w.fmtDate(x.game_date)} · ${String(x.kickoff_time).slice(0,5)} · ${w.esc(x.format)} · £${w.esc(x.cost)}</div>${x.invite_status==='invited'&&x.game_status==='open'?`<div class="requestActions"><button class="btn green small" data-i="${x.invite_id}" data-r="interested">I’M INTERESTED</button><button class="btn ghost small" data-i="${x.invite_id}" data-r="declined">NOT THIS TIME</button></div>`:''}</div>`;const st=x.request_status||'pending',lab=st==='accepted'?"YOU’RE IN":st==='cancelled'?'GAME CANCELLED':st==='declined'?'NOT THIS TIME':'WAITING FOR ORGANISER';return `<div class="card"><div class="statusHero ${st==='accepted'?'statusAccepted':st==='pending'?'statusPending':'statusDeclined'}">${lab}</div><b>${w.esc(x.venue)}</b><div class="muted">${w.fmtDate(x.game_date)} · ${String(x.kickoff_time).slice(0,5)} · ${w.esc(x.format)} · £${w.esc(x.cost)}</div></div>`};active.innerHTML=aa.length?aa.map(render).join(''):'<div class="card"><b>Nothing needs your attention</b><div class="muted">New requests and invites will appear here.</div></div>';past.innerHTML=pp.length?pp.map(render).join(''):'<div class="card"><b>No past activity</b></div>';d.getElementById('cleanPastBtn').textContent=`PAST ACTIVITY${pp.length?' ('+pp.length+')':''}`;active.querySelectorAll('[data-i]').forEach(b=>b.onclick=async()=>{await w.respondPoolInvite(b.dataset.i,b.dataset.r);setTimeout(openActivity,250)})}catch(e){er.textContent=e.message;er.style.display='block'}}
});
</script></body></html>
