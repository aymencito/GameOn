<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0f12"><title>GameOn Clean</title><style>html,body{margin:0;height:100%;background:#0b0f12}iframe{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="app" src="./?clean=1"></iframe><script>
const f=document.getElementById('app');
f.addEventListener('load',()=>{const w=f.contentWindow,d=f.contentDocument;if(!d||!w)return;
const home=d.getElementById('home');
if(home){const buttons=[...home.querySelectorAll('button')];buttons.forEach(b=>{if(b.textContent.includes('MY REQUESTS')||b.textContent.includes('GAME INVITES'))b.remove()});const organise=buttons.find(b=>b.textContent.includes('ORGANISE'));const pool=[...home.querySelectorAll('button')].find(b=>b.textContent.includes('PLAYER POOL'));const act=d.createElement('button');act.className='btn ghost';act.innerHTML='📋 MY ACTIVITY <span id="cleanActivityBadge" class="badge hidden">0</span>';act.onclick=()=>w.cleanOpenActivity();if(organise)home.insertBefore(act,organise);const play=[...home.querySelectorAll('button')].find(b=>b.textContent.includes('I WANT TO PLAY'));if(play)play.textContent='⚽ FIND A GAME';if(organise)organise.textContent='👥 ORGANISE';if(pool)pool.textContent='🟢 PLAYER POOL';const note=home.querySelector('.note');if(note)note.textContent='Active requests and invites stay up front. Finished items are tucked away in Past activity.'}
const app=d.querySelector('.app');
if(app&&!d.getElementById('cleanActivity')){const sec=d.createElement('section');sec.id='cleanActivity';sec.className='screen';sec.innerHTML='<button class="back">‹</button><h2>My Activity</h2><p class="sub">Only things that still need your attention are shown here.</p><div id="cleanActive"></div><button id="cleanPastBtn" class="btn ghost small">PAST ACTIVITY</button><div id="cleanPast" class="hidden"></div><div id="cleanActivityError" class="error"></div><button class="btn green">FIND A GAME</button>';sec.querySelector('.back').onclick=()=>w.show('home');sec.querySelector('.btn.green').onclick=()=>w.openGames();sec.querySelector('#cleanPastBtn').onclick=()=>sec.querySelector('#cleanPast').classList.toggle('hidden');app.appendChild(sec)}
if(app&&!d.getElementById('cleanOrgHistory')){const sec=d.createElement('section');sec.id='cleanOrgHistory';sec.className='screen';sec.innerHTML='<button class="back">‹</button><h2>Past games</h2><p class="sub">Filled and cancelled games live here, away from your active dashboard.</p><div id="cleanOrgHistoryList"></div><div id="cleanOrgHistoryError" class="error"></div>';sec.querySelector('.back').onclick=()=>w.openDashboard();app.appendChild(sec)}
const footer=d.querySelector('.footer');if(footer){footer.innerHTML='<div>⚽<br>Play</div><div>📋<br>Activity</div><div>👥<br>Organise</div><div>⌂<br>Home</div>';const x=[...footer.children];x[0].onclick=()=>w.openGames();x[1].onclick=()=>w.cleanOpenActivity();x[2].onclick=()=>w.organiserEntry();x[3].onclick=()=>w.show('home')}
const requested=d.getElementById('requested');if(requested){const b=[...requested.querySelectorAll('button')].find(x=>x.textContent.includes('REQUEST'));if(b){b.textContent='VIEW MY ACTIVITY';b.onclick=()=>w.cleanOpenActivity()}}
const poolDone=d.getElementById('poolDone');if(poolDone){const b=[...poolDone.querySelectorAll('button')].find(x=>x.textContent.includes('INVITE'));if(b){b.textContent='VIEW MY ACTIVITY';b.onclick=()=>w.cleanOpenActivity()}}
const oldDash=w.openDashboard;w.openDashboard=async function(){await oldDash();setTimeout(()=>{const dash=d.getElementById('orgDashboard');if(!dash)return;const h=[...dash.querySelectorAll('h2')].find(x=>x.textContent.includes('My'));if(h)h.childNodes[0].textContent='My active games ';let link=d.getElementById('cleanPastGamesLink');if(!link){link=d.createElement('button');link.id='cleanPastGamesLink';link.className='linkbtn';link.textContent='View past games';link.onclick=()=>w.cleanOpenOrgHistory();const mg=d.getElementById('myGames');if(mg)dash.insertBefore(link,mg)}},30)};
const oldReq=w.openRequests;w.openRequests=async function(gameId){w.currentRequestGame=gameId;w.show('requests');const box=d.getElementById('requestList');box.innerHTML='<p class="muted">Loading…</p>';const gq=await w.sb.from('games').select('id,venue,game_date,kickoff_time,format,players_needed,cost,organiser_phone,status').eq('id',gameId).single();if(gq.error){w.err('requestError',gq.error.message);return}d.getElementById('requestGame').innerHTML=w.gameCard(gq.data,false);const rq=await w.sb.from('join_requests').select('id,player_name,player_phone,player_level,status,created_at').eq('game_id',gameId).eq('status','pending').order('created_at');if(rq.error){w.err('requestError',rq.error.message);return}box.innerHTML=rq.data&&rq.data.length?rq.data.map(r=>w.requestCard(r,gq.data)).join(''):'<div class="card"><b>No pending requests</b><div class="muted">Finished requests are kept out of your active queue.</div></div>'};
w.cleanOpenActivity=async function(){w.show('cleanActivity');const activeBox=d.getElementById('cleanActive'),pastBox=d.getElementById('cleanPast'),pastBtn=d.getElementById('cleanPastBtn');activeBox.innerHTML='<p class="muted">Loading…</p>';pastBox.innerHTML='';pastBox.classList.add('hidden');let active=[],past=[];try{for(const token of w.getTokens()){const q=await w.sb.rpc('get_request_status',{p_tracking_token:token});if(!q.error&&q.data&&q.data[0]){const r=q.data[0],st=r.request_status||'pending',o={kind:'request',...r};(st==='pending'||st==='accepted'?active:past).push(o)}}const pt=localStorage.getItem('gameon_pool_token');if(pt){const q=await w.sb.rpc('get_pool_invites',{p_tracking_token:pt});if(!q.error&&q.data)q.data.forEach(i=>{const o={kind:'invite',...i};(i.invite_status==='invited'&&i.game_status==='open'?active:past).push(o)})}const render=o=>{if(o.kind==='invite'){const live=o.invite_status==='invited'&&o.game_status==='open',label=o.game_status==='cancelled'?'GAME CANCELLED':o.invite_status==='declined'?'NOT THIS TIME':o.invite_status==='interested'?'INTEREST SENT':'GAME INVITE',acts=live?`<div class="requestActions"><button class="btn green small" onclick="parent.document.getElementById('app').contentWindow.respondPoolInvite('${o.invite_id}','interested')">I’M INTERESTED</button><button class="btn ghost small" onclick="parent.document.getElementById('app').contentWindow.respondPoolInvite('${o.invite_id}','declined')">NOT THIS TIME</button></div>`:'';return `<div class="card"><span class="tag ${live?'pending':'declined'}">${label}</span><b>${w.esc(o.venue)}</b><div class="muted">${w.fmtDate(o.game_date)} · ${String(o.kickoff_time).slice(0,5)} · ${w.esc(o.format)} · £${w.esc(o.cost)}</div>${acts}</div>`}const st=o.request_status||'pending',hero=st==='accepted'?'YOU’RE IN':st==='declined'?'NOT THIS TIME':st==='cancelled'?'GAME CANCELLED':'WAITING FOR ORGANISER',cls=st==='accepted'?'statusAccepted':st==='pending'?'statusPending':'statusDeclined';let wa='';if(st==='accepted'&&o.organiser_phone){const p=w.normalisePhone(o.organiser_phone),txt=encodeURIComponent('Hi, I was accepted through GameOn. Just checking the final game details. ⚽');wa=`<button class="btn green small" onclick="window.open('https://wa.me/${p}?text=${txt}','_blank')">MESSAGE ORGANISER</button>`}return `<div class="card"><div class="statusHero ${cls}">${hero}</div><b>${w.esc(o.venue)}</b><div class="muted">${w.fmtDate(o.game_date)} · ${String(o.kickoff_time).slice(0,5)} · ${w.esc(o.format)} · £${w.esc(o.cost)}</div>${wa}</div>`};activeBox.innerHTML=active.length?active.map(render).join(''):'<div class="card"><b>Nothing needs your attention</b><div class="muted">New requests and game invites will appear here.</div></div>';pastBox.innerHTML=past.length?past.map(render).join(''):'<div class="card"><b>No past activity yet</b></div>';pastBtn.textContent=`PAST ACTIVITY${past.length?' ('+past.length+')':''}`;const badge=d.getElementById('cleanActivityBadge'),n=active.filter(x=>x.kind==='invite'||x.request_status==='pending').length;if(n){badge.textContent=n;badge.classList.remove('hidden')}else badge.classList.add('hidden')}catch(e){const er=d.getElementById('cleanActivityError');er.textContent=e.message;er.style.display='block'}};
w.cleanOpenOrgHistory=async function(){w.show('cleanOrgHistory');const box=d.getElementById('cleanOrgHistoryList');box.innerHTML='<p class="muted">Loading…</p>';const u=await w.sb.auth.getUser();if(!u.data.user){w.show('orgAuth');return}const q=await w.sb.from('games').select('id,venue,game_date,kickoff_time,format,cost,status').eq('organiser_id',u.data.user.id).in('status',['filled','cancelled']).order('game_date',{ascending:false});if(q.error){const er=d.getElementById('cleanOrgHistoryError');er.textContent=q.error.message;er.style.display='block';return}box.innerHTML=q.data&&q.data.length?q.data.map(g=>`<div class="card"><span class="tag ${w.esc(g.status)}">${w.esc(g.status.toUpperCase())}</span><b>${w.esc(g.venue)}</b><div class="muted">${w.fmtDate(g.game_date)} · ${String(g.kickoff_time).slice(0,5)} · ${w.esc(g.format)} · £${w.esc(g.cost)}</div></div>`).join(''):'<div class="card"><b>No past games yet</b></div>'};
});
</script></body></html>
